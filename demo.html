<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-spinner {
            display: none;
            width: 1.5rem;
            height: 1.5rem;
            border: 0.25em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border .75s linear infinite;
        }
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Contact Us</h4>
                    </div>
                    <div class="card-body">
                        <form id="contactForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="companyName" class="form-label">Company Name</label>
                                    <input type="text" class="form-control" id="companyName" name="companyName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="jobTitle" class="form-label">Job Title</label>
                                    <input type="text" class="form-control" id="jobTitle" name="jobTitle" required>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" name="firstName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" name="lastName" required>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="country" class="form-label">Country</label>
                                    <input type="text" class="form-control" id="country" name="country" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="phoneNumber" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="organizationType" class="form-label">What kind of organization are you?</label>
                                <select class="form-select" id="organizationType" name="organizationType" required>
                                    <option value="" selected disabled>Select an option</option>
                                    <option value="Bank">Bank</option>
                                    <option value="CDFI">CDFI</option>
                                    <option value="Credit Union">Credit Union</option>
                                    <option value="Non-Financial Enterprise">Non-Financial Enterprise</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="inquiry" class="form-label">Share more about your inquiry?</label>
                                <textarea class="form-control" id="inquiry" name="inquiry" rows="8" maxlength="3000" required></textarea>
                                <div class="form-text">Maximum 500 words</div>
                            </div>
                            
                            <div class="d-flex align-items-center">
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    <span id="submitText">Submit</span>
                                    <span class="loading-spinner" id="spinner"></span>
                                </button>
                                <div id="formMessage" class="ms-3"></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const submitText = document.getElementById('submitText');
            const formMessage = document.getElementById('formMessage');
            
            // Show loading state
            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            submitText.textContent = 'Submitting...';
            formMessage.textContent = '';
            
            try {
                // Get form values
                const formData = {
                    companyName: document.getElementById('companyName').value,
                    jobTitle: document.getElementById('jobTitle').value,
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    country: document.getElementById('country').value,
                    phoneNumber: document.getElementById('phoneNumber').value,
                    organizationType: document.getElementById('organizationType').value,
                    inquiry: document.getElementById('inquiry').value,
                };
                
                // Send data to API endpoint
                const response = await fetch('https://contactusapi-1.onrender.com/request-demo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();

                if (response.ok) {
                    // Success
                    formMessage.textContent = 'Thank you! Your submission has been received.';
                    formMessage.style.color = 'green';
                    document.getElementById('contactForm').reset();
                } else {
                    // Error from server
                    formMessage.textContent = result.message || 'There was an error submitting your form.';
                    formMessage.style.color = 'red';
                }
            } catch (error) {
                // Network error
                console.error('Error:', error);
                formMessage.textContent = 'There was a network error. Please try again.';
                formMessage.style.color = 'red';
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                submitText.textContent = 'Submit';
            }
        });
    </script>
</body>
</html>
